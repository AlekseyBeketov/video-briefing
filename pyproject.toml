[project]
name = "video-briefing"
version = "0.1.0"
description = "Evidence-first Russian video briefings with cached grounded Q&A"
requires-python = ">=3.11,<3.15"
dependencies = ["requests==2.34.2", "youtube-transcript-api==1.2.4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
video-briefing = "video_briefing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_briefing*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
