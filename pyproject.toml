[project]
name = "video-briefing"
version = "0.2.0"
description = "Evidence-first video transcript CLI and MCP server with optional Russian/English ASR"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["requests==2.34.2", "youtube-transcript-api==1.2.4"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.0"]
mcp = ["mcp>=2.0,<3"]
asr = ["av==18.1.0", "transcribe-cpp==0.4.0"]

[project.scripts]
video-briefing = "video_briefing.cli:main"
video-briefing-mcp = "video_briefing.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_briefing*"]

[tool.setuptools.package-data]
video_briefing = ["resources/*.json", "resources/*.md"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
